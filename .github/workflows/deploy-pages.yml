name: CI & Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  ci:
    name: CI (Type Check & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码仓库
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npx tsc -b

      - name: 构建项目
        run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: 上传构建产物（供 deploy job 使用）
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifact
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist-artifact
          path: ./dist

      - name: 上传构建产物到 Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
